/* ============================================================
   BEAT-ДВИЖОК (Web Audio: синтез барабанов и баса)
   ============================================================ */
const BEAT = {
  ctx: null, master: null, noiseBuf: null, timer: null, step: 0, next: 0,
  bpm: 128, pattern: DRUMS.map(() => Array(16).fill(false)), playing: false, playingId: null, onStep: null,
  ensure() {
    if (!this.ctx) { this.ctx = new AudioContext(); this.master = this.ctx.createGain(); this.master.gain.value = .85; this.master.connect(this.ctx.destination); }
    if (this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  noise(c) {
    if (!this.noiseBuf) { const b = c.createBuffer(1, c.sampleRate, c.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; this.noiseBuf = b; }
    return this.noiseBuf;
  },
  hit(drum, when, step) {
    const c = this.ensure(), t = c.currentTime + (when || 0), out = this.master;
    if (drum === "kick") {
      const o = c.createOscillator(), g = c.createGain();
      o.frequency.setValueAtTime(155, t); o.frequency.exponentialRampToValueAtTime(42, t + .11);
      g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(.001, t + .34);
      o.connect(g).connect(out); o.start(t); o.stop(t + .36);
    } else if (drum === "snare") {
      const n = c.createBufferSource(); n.buffer = this.noise(c);
      const bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1900; bp.Q.value = .8;
      const g = c.createGain(); g.gain.setValueAtTime(.8, t); g.gain.exponentialRampToValueAtTime(.001, t + .18);
      n.connect(bp).connect(g).connect(out); n.start(t); n.stop(t + .2);
      const o = c.createOscillator(); o.type = "triangle"; o.frequency.value = 196;
      const og = c.createGain(); og.gain.setValueAtTime(.35, t); og.gain.exponentialRampToValueAtTime(.001, t + .09);
      o.connect(og).connect(out); o.start(t); o.stop(t + .1);
    } else if (drum === "hat") {
      const n = c.createBufferSource(); n.buffer = this.noise(c);
      const hp = c.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 7600;
      const g = c.createGain(); g.gain.setValueAtTime(.32, t); g.gain.exponentialRampToValueAtTime(.001, t + .055);
      n.connect(hp).connect(g).connect(out); n.start(t); n.stop(t + .07);
    } else if (drum === "clap") {
      [0, .013, .028].forEach((off, i) => {
        const n = c.createBufferSource(); n.buffer = this.noise(c);
        const bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1150; bp.Q.value = 1.6;
        const g = c.createGain(); const dur = i === 2 ? .16 : .09;
        g.gain.setValueAtTime(.55, t + off); g.gain.exponentialRampToValueAtTime(.001, t + off + dur);
        n.connect(bp).connect(g).connect(out); n.start(t + off); n.stop(t + off + dur + .02);
      });
    } else {
      const o = c.createOscillator(); o.type = "sawtooth";
      o.frequency.value = [55, 55, 65.41, 49][(step || 0) % 4];
      const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 420; lp.Q.value = 1.1;
      const g = c.createGain(); g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.001, t + .24);
      o.connect(lp).connect(g).connect(out); o.start(t); o.stop(t + .26);
    }
  },
  start(pattern, bpm, id) {
    this.stop(false);
    if (pattern) this.pattern = pattern.map(r => [...r]);
    if (bpm) this.bpm = bpm;
    this.playingId = id || null;
    const c = this.ensure();
    this.playing = true; this.step = 0; this.next = c.currentTime + .08;
    this.timer = setInterval(() => this.tick(), 25);
  },
  stop(clearId) {
    this.playing = false;
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    if (clearId !== false) this.playingId = null;
    if (this.onStep) this.onStep(-1);
  },
  tick() {
    const c = this.ctx, spb = 60 / this.bpm / 4;
    while (this.next < c.currentTime + .12) {
      const s = this.step, swing = s % 2 ? spb * .16 : 0;
      const when = Math.max(0, this.next + swing - c.currentTime);
      DRUMS.forEach((d, r) => { if (this.pattern[r] && this.pattern[r][s]) this.hit(d.key, when, s); });
      setTimeout(() => this.onStep && this.onStep(s), when * 1000);
      this.next += spb; this.step = (this.step + 1) % 16;
    }
  },
};
function stopAllEngines() {
  BEAT.stop();
  if (GM.comet.on) GM.comet.on = false;
  if (GM.quiz.audio) GM.quiz.audio.pause();
  clearTimeout(GM.quiz.timer);
  clearTimeout(GM.nova.timer);
  if (GM.nova.on) { GM.nova.on = false; GM.nova.active = -1; }
}
function generatePattern(style) {
  const p = DRUMS.map(() => Array(16).fill(false));
  const meta = STYLES.find(s => s.key === style);
  const bpm = meta.bpm[0] + Math.floor(Math.random() * (meta.bpm[1] - meta.bpm[0] + 1));
  const mark = (r, steps, prob) => steps.forEach(s => { if (rnd(prob == null ? 1 : prob)) p[r][s] = true; });
  if (style === "phonk") { mark(0, [0,3,6,8,11,14]); if (rnd(.5)) p[0][7]=true; if (rnd(.4)) p[0][10]=true; mark(1,[4,12]); for (let i=0;i<16;i++) if (rnd(.86)) p[2][i]=true; mark(3,[4,12],.7); mark(4,[0,3,6,8,11,14],.8); mark(4,[2,10],.5); }
  else if (style === "lofi") { if (rnd(.5)) mark(0,[0,7,8]); else mark(0,[0,10]); if (rnd(.4)) p[0][13]=true; mark(1,[4,12]); for (let i=0;i<16;i+=2) if (rnd(.75)) p[2][i]=true; mark(3,[12],.45); mark(4,[0,8]); mark(4,[11],.4); }
  else if (style === "drill") { mark(0,[0,6,9,12]); if (rnd(.6)) p[0][14]=true; if (rnd(.35)) p[0][3]=true; mark(1,[4,12]); if (rnd(.4)) p[1][15]=true; for (let i=0;i<16;i++) if (rnd(.8)) p[2][i]=true; mark(3,[4,12],.8); mark(4,[0,6,9,12],.75); mark(4,[14],.5); }
  else { mark(0,[0,4,8,12]); mark(1,[4,12]); mark(2,[2,6,10,14]); if (rnd(.5)) p[2][0]=true; mark(3,[4,12],.6); mark(4,[2,6,10,14],.9); mark(4,[0],.5); }
  return { pattern: p, bpm };
}

function gComet() {
  return `<div class="card" style="padding:24px">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <div><h2 class="h2" style="display:flex;gap:10px;align-items:center">${I.fire.replace("<svg",'<svg style="width:20px;height:20px;color:var(--amber)"')} Охота на кометы</h2>

      <div style="display:flex;gap:9px;align-items:center">
        <span class="tagchip" style="font-size:12px">очки: <b id="c-score" style="color:var(--cyan-hi)">0</b></span>
        <span class="tagchip" style="font-size:12px">время: <b id="c-time" style="color:var(--amber)">30</b></span>
        <button class="btn rose sm" data-act="g-comet-stop">Стоп</button>
      </div>
    </div>
    <canvas id="comet-cv" style="margin-top:16px"></canvas>
  </div>`;
}
function cometInit() {
  const cv = $("#comet-cv"); if (!cv) return;
  const x = cv.getContext("2d");
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; x.scale(dpr, dpr);
  const C = GM.comet;
  C.items = []; C.parts = []; C.score = 0; C.t0 = Date.now(); C.on = true;
  let spawn = 0;
  const loop = () => {
    if (!C.on) return;
    const left = 30 - (Date.now() - C.t0) / 1000;
    const te = $("#c-time"), se = $("#c-score");
    if (te) te.textContent = Math.max(0, Math.ceil(left));
    if (se) se.textContent = C.score;
    if (left <= 0) {
      C.on = false;
      const best = Math.max(C.score, S.data.bestStreak);
      const beatBest = C.score > S.data.bestStreak;
      S.data.bestStreak = best; saveMe();
      addXp(C.score * 2);
      if (beatBest) confetti();
      toast(`Охота окончена: ${C.score} комет, +${C.score * 2} XP${beatBest ? " — новый рекорд!" : ""}`, "ok");
      setTimeout(() => { if (S.view === "games") renderView(); }, 900);
      return;
    }
    x.clearRect(0, 0, W, H);
    if (++spawn % 26 === 0 && C.items.length < 5) C.items.push({ x: Math.random() * (W - 60) + 30, y: -20, vx: (Math.random() - .5) * 2.4, vy: 1.6 + Math.random() * 2.6, r: 15 + Math.random() * 9, hue: Math.random() });
    C.items = C.items.filter(it => it.y < H + 40);
    for (const it of C.items) {
      it.x += it.vx; it.y += it.vy;
      const g = x.createRadialGradient(it.x, it.y, 1, it.x, it.y, it.r + 14);
      g.addColorStop(0, "rgba(233,240,255,.95)");
      g.addColorStop(.35, it.hue > .5 ? "rgba(125,216,255,.55)" : "rgba(255,180,84,.55)");
      g.addColorStop(1, "rgba(125,216,255,0)");
      x.fillStyle = g; x.beginPath(); x.arc(it.x, it.y, it.r + 14, 0, 7); x.fill();
      x.strokeStyle = "rgba(125,216,255,.5)"; x.lineWidth = 2;
      x.beginPath(); x.moveTo(it.x, it.y - it.r); x.lineTo(it.x - it.vx * 9, it.y - it.r - it.vy * 9); x.stroke();
    }
    C.parts = C.parts.filter(p => p.life > 0);
    for (const p of C.parts) {
      p.x += p.vx; p.y += p.vy; p.vy += .18; p.life -= .045;
      x.globalAlpha = Math.max(p.life, 0); x.fillStyle = p.col;
      x.fillRect(p.x, p.y, 4, 4); x.globalAlpha = 1;
    }
    requestAnimationFrame(loop);
  };
  const hit = e => {
    const r = cv.getBoundingClientRect();
    const px = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const py = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    for (let i = C.items.length - 1; i >= 0; i--) {
      const it = C.items[i];
      if ((px - it.x) ** 2 + (py - it.y) ** 2 < (it.r + 16) ** 2) {
        C.items.splice(i, 1); C.score++; BEAT.hit("hat");
        for (let k = 0; k < 12; k++) C.parts.push({ x: it.x, y: it.y, vx: (Math.random() - .5) * 7, vy: (Math.random() - .7) * 7, life: 1, col: ["#bfb0ff", "#e8a94f", "#efeaff"][k % 3] });
        break;
      }
    }
  };
  cv.addEventListener("pointerdown", hit);
  loop();
}

    <div class="modal-card" style="max-width:400px">
      <div class="modal-head"><b style="display:flex;gap:9px;align-items:center">${I.bell.replace("<svg", '<svg style="width:16px;height:16px;color:var(--cyan-hi)"')} Уведомления</b>
        <button class="icon-btn" data-act="n-close" aria-label="Закрыть">${I.x}</button></div>

        ${S.data.notifs.length ? S.data.notifs.map(n => {
          const [ic, col] = KIND[n.kind] || KIND.chart;
          return `<div class="feed-item" style="${n.read ? "opacity:.55" : ""}">
            <span style="width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--sp-800);color:${col}">${ic.replace("<svg", '<svg style="width:15px;height:15px"')}</span>
            <div class="txt">${esc(n.text)}<time>${timeAgo(n.ts)}${n.read ? "" : " · новое"}</time></div>
          </div>`;
        }).join("") : `<p style="padding:30px;text-align:center;color:var(--sp-500);font-weight:500">Тишина в эфире — уведомлений нет</p>`}
      </div>
      <div style="padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px">
        <button class="btn ghost sm" style="flex:1" data-act="n-readall">Прочитать все</button>
        <button class="btn rose sm" style="flex:1" data-act="n-clear">${I.trash.replace("<svg", '<svg style="width:13px;height:13px"')} Очистить</button>
      </div>

  $("#n-modal").addEventListener("mousedown", e => { if (e.target.id === "n-modal") closePay(); });
}
/* ============================================================
   РЕДАКТИРОВАНИЕ ПРОФИЛЯ
   ============================================================ */
function openEditMe() {

      <div class="modal-body">
        <div style="display:flex;justify-content:center;margin-bottom:16px" id="me-prev">${ava(S.me, 74, true)}</div>
        <div class="field"><label>Имя и фамилия</label><input id="me-name" value="${esc(S.me.name)}" maxlength="30"></div>
        <div class="field"><label>О себе</label><textarea id="me-bio" rows="3" maxlength="140" style="width:100%;resize:none;background:var(--sp-850);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 15px;font-size:14px;outline:none;font-family:var(--font-b)">${esc(S.me.bio)}</textarea></div>
        <div class="field"><label>Цвет профиля</label>
          <div class="colorpick" id="me-colors">${AVA_COLORS.map((c, i) => `<button data-act="me-color" data-id="${i}" class="${S.me.colors[0] === c[0] ? "on" : ""}" style="background:linear-gradient(135deg,${c[0]},${c[1]})"></button>`).join("")}</div>
        </div>
        <div id="me-err"></div>
        <button class="btn primary wide" data-act="me-save">${I.check} Сохранить</button>

  $("#me-modal").addEventListener("mousedown", e => { if (e.target.id === "me-modal") closePay(); });
}
let meColor = null;
function saveEditMe() {
  const name = ($("#me-name").value || "").trim();
  const bio = ($("#me-bio").value || "").trim();
  if (name.length < 2) { $("#me-err").innerHTML = '<span class="msg">Имя — минимум 2 символа</span>'; return; }
  S.me.name = name; S.me.bio = bio || S.me.bio;
  if (meColor != null) S.me.colors = AVA_COLORS[meColor];
  const users = DB.users();
  const i = users.findIndex(u => u.id === S.me.id);
  if (i >= 0) users[i] = S.me;
  DB.saveUsers(users);
  busPost({ t: "hello", uid: S.me.id });
  closePay(); meColor = null;
  toast("Профиль обновлён", "ok");
  renderShell(); renderView();
}

/* ============================================================
   ИГРА «СВЕРХНОВАЯ» (реакция) + активность недели
   ============================================================ */
GM.nova = { on: false, round: 0, score: 0, active: -1, timer: null, total: 20 };
function gNova() {
  const n = GM.nova;
  return `<div class="card" style="padding:24px">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <div><h2 class="h2" style="display:flex;gap:10px;align-items:center">${I.bolt.replace("<svg", '<svg style="width:20px;height:20px;color:var(--cyan-hi)"')} Сверхновая</h2>
      <p style="font-size:12.5px;color:var(--sp-400);font-weight:500;margin-top:4px">Звезда вспыхивает — успей нажать. 20 раундов · скорость растёт</p></div>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="tagchip">раунд: <b style="color:var(--cyan-hi)">${Math.min(n.round + 1, n.total)}/${n.total}</b></span>
        <span class="tagchip">попаданий: <b style="color:var(--amber)">${n.score}</b></span>
        <button class="btn rose sm" data-act="g-nova-stop">Стоп</button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px auto 0;max-width:380px">
      ${Array.from({ length: 16 }, (_, i) => `<button class="memcell ${n.active === i ? "open" : ""}" data-act="nova" data-id="${i}" style="${n.active === i ? "background:radial-gradient(circle,rgba(125,216,255,.5),rgba(56,189,248,.15));border-color:var(--cyan);box-shadow:var(--glow-cyan)" : ""}" aria-label="Ячейка">${n.active === i ? "✸" : "✦"}</button>`).join("")}
    </div>
  </div>`;
}
function novaNext() {
  const n = GM.nova;
  if (!n.on) return;
  if (n.round >= n.total) { novaEnd(); return; }
  n.active = Math.floor(Math.random() * 16);
  renderView();
  const window_ = Math.max(380, 950 - n.round * 28);
  clearTimeout(n.timer);
  n.timer = setTimeout(() => { if (n.on && n.active >= 0) { n.active = -1; BEAT.hit("kick"); n.round++; novaNext(); } }, window_);
}
function novaTap(i) {
  const n = GM.nova;
  if (!n.on || n.active < 0) return;
  if (i === n.active) {
    clearTimeout(n.timer);
    n.score++; n.active = -1; n.round++;
    BEAT.hit("clap");
    novaNext();
  } else {
    BEAT.hit("hat");
  }
}
function novaEnd() {
  const n = GM.nova;
  n.on = false; n.active = -1;
  const xp = n.score * 3;
  addXp(xp);
  if (n.score >= 15) confetti();
  toast(`Сверхновая: ${n.score}/${n.total} попаданий · +${xp} XP${n.score >= 15 ? " — космос!" : ""}`, "ok");
  GM.nova.score = 0; GM.nova.round = 0;
  renderView();
}
/* активность недели (детерминированная от id пользователя) */
function weekBars() {
  let seed = 0; for (const ch of (S.me ? S.me.id : "x")) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
  const days = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
  const vals = days.map((_, i) => { seed = (seed * 1103515245 + 12345) >>> 0; return 22 + (seed % 74); });
  const max = Math.max(...vals);
  return `<div style="display:flex;align-items:flex-end;gap:9px;height:96px;padding-top:6px">
    ${vals.map((v, i) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px" title="${days[i]}: ${Math.round(v * 1.4)} мин">
      <div style="width:100%;border-radius:6px 6px 3px 3px;height:${(v / max) * 74}px;background:${v === max ? "linear-gradient(180deg,var(--amber),#f59028)" : "linear-gradient(180deg,var(--cyan),#2f7fe0)"};transition:height .5s;box-shadow:${v === max ? "var(--glow-amber)" : "none"}"></div>
      <span style="font-family:var(--font-m);font-size:9px;color:${v === max ? "var(--amber)" : "var(--sp-500)"}">${days[i]}</span>
    </div>`).join("")}
  </div>`;
}

/* ============================================================
   ДОСТИЖЕНИЯ (считаются по реальной статистике из БД)
   ============================================================ */
const ACHV = [
  { id:"first", icon:"play", t:"Первый контакт", d:"Включи свой первый трек", test: d => (d.stats["track-start"] || 0) >= 1 },
  { id:"melo", icon:"disc", t:"Меломан", d:"25 прослушиваний треков", test: d => (d.stats["track-start"] || 0) >= 25 },
  { id:"beat", icon:"drum", t:"Битмейкер", d:"Сохрани хотя бы один бит", test: d => d.projects.length >= 1 },
  { id:"coll", icon:"heart", t:"Коллекционер", d:"Собери 5 любимых треков", test: d => d.likes.length >= 5 },
  { id:"frnd", icon:"users", t:"Дружелюбный", d:"Добавь 3 друзей", test: d => d.friends.length >= 3 },
  { id:"talk", icon:"chat", t:"Радиолюбитель", d:"Отправь 10 сообщений в чат", test: d => (d.stats["msg"] || 0) >= 10 },
  { id:"quiz", icon:"mic", t:"Золотое ухо", d:"10 верных ответов в викторине", test: d => (d.stats["game-win"] || 0) >= 10 },
  { id:"hunt", icon:"fire", t:"Охотник за кометами", d:"Набери 10 очков в охоте", test: d => d.bestStreak >= 10 },
  { id:"wrld", icon:"globe", t:"Глобальный слух", d:"Включи трек из мирового поиска", test: d => (d.stats["global-play"] || 0) >= 1 },
  { id:"chrt", icon:"chart", t:"Чартовед", d:"Запусти чарт недели", test: d => (d.stats["chart-play"] || 0) >= 1 },
  { id:"lvl3", icon:"star", t:"Восхождение", d:"Достигни 3 уровня", test: d => d.xp >= 500 },
  { id:"pro", icon:"crown", t:"Меценат", d:"Подключи подписку Beat Pro", test: d => d.pro },
];
function achvHtml() {
  const d = S.data;
  const earned = ACHV.filter(a => a.test(d)).length;
  return `<div class="sec-head"><div><p class="kicker">${I.star} Ачивки</p><h2 class="h2" style="margin-top:6px">Достижения · ${earned}/${ACHV.length}</h2></div></div>
  <div class="achv-grid stag">${ACHV.map(a => {
    const on = a.test(d);
    return `<div class="achv ${on ? "earned" : ""}" title="${esc(a.d)}">
      ${on ? `<span class="chk">${I.check}</span>` : ""}
      <span class="medal">${I[a.icon]}</span><b>${a.t}</b><small>${a.d}</small></div>`;
  }).join("")}</div>`;
}
/* ---------- лидерборд: реальные XP из БД ---------- */
function lbHtml() {
  const rows = DB.users().map(u => ({ u, xp: (u.id === S.me.id ? S.data : DB.udata(u.id)).xp })).sort((a, b) => b.xp - a.xp).slice(0, 6);
  return `<div class="sec-head"><div><p class="kicker">${I.bolt} Соревнование</p><h2 class="h2" style="margin-top:6px">Топ недели по XP</h2></div></div>
  <div class="card" style="padding:12px">
    ${rows.map((r, i) => `<div class="lb-row ${i === 0 ? "top1" : i === 1 ? "top2" : i === 2 ? "top3" : ""} ${r.u.id === S.me.id ? "merow" : ""}">
      <span class="rank">${i + 1}</span>
      <button data-act="profile" data-id="${r.u.id === S.me.id ? "me" : r.u.id}" style="display:flex">${ava(r.u, 36, S.online.has(r.u.id) || r.u.online)}</button>
      <button data-act="profile" data-id="${r.u.id === S.me.id ? "me" : r.u.id}" style="min-width:0;text-align:left">
        <b style="display:block;font-size:13.5px">${esc(r.u.name)}${r.u.id === S.me.id ? ' <span class="fbadge">ты</span>' : ""}</b>
        <small style="font-family:var(--font-m);font-size:10px;color:var(--sp-500)">@${esc(r.u.username)}</small>
      </button>
      <span class="xpv">${r.xp.toLocaleString("ru-RU")} XP</span>
    </div>`).join("")}
    <p style="font-family:var(--font-m);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--sp-600);text-align:center;padding:10px 0 2px">рейтинг считается из базы данных платформы</p>
  </div>`;
}

/* ---------- старт ---------- */
seedDB();
pbRender();
