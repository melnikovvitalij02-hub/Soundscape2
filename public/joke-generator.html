<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joke Generator</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  background: white;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  padding: 40px;
  max-width: 600px;
  width: 100%;
  text-align: center;
}

h1 {
  color: #333;
  margin-bottom: 10px;
  font-size: 2.5em;
}

.subtitle {
  color: #666;
  margin-bottom: 30px;
  font-size: 1em;
}

.joke-box {
  background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  border-radius: 15px;
  padding: 30px;
  margin: 30px 0;
  min-height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.joke-text {
  font-size: 1.2em;
  color: #333;
  line-height: 1.6;
  font-weight: 500;
}

.loading {
  color: #667eea;
  font-style: italic;
}

.buttons {
  display: flex;
  gap: 15px;
  margin-top: 30px;
  flex-wrap: wrap;
}

button {
  flex: 1;
  min-width: 150px;
  padding: 14px 28px;
  font-size: 1em;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.btn-primary {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
}

.btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 35px rgba(102, 126, 234, 0.5);
}

.btn-primary:active {
  transform: translateY(-1px);
}

.btn-secondary {
  background: #f0f0f0;
  color: #333;
  border: 2px solid #ddd;
}

.btn-secondary:hover {
  background: #e8e8e8;
  border-color: #999;
}

.category-select {
  width: 100%;
  padding: 12px;
  font-size: 1em;
  border: 2px solid #ddd;
  border-radius: 10px;
  margin-bottom: 20px;
  cursor: pointer;
  background: white;
  color: #333;
}

.category-select:hover {
  border-color: #667eea;
}

.stats {
  display: flex;
  gap: 20px;
  justify-content: center;
  margin-top: 30px;
  flex-wrap: wrap;
}

.stat-item {
  background: #f5f5f5;
  padding: 15px 25px;
  border-radius: 10px;
  text-align: center;
}

.stat-value {
  font-size: 1.8em;
  font-weight: bold;
  color: #667eea;
}

.stat-label {
  font-size: 0.9em;
  color: #666;
  margin-top: 5px;
}

.error {
  background: #ffebee;
  color: #c62828;
  padding: 15px;
  border-radius: 10px;
  margin: 20px 0;
  border-left: 4px solid #c62828;
}

.success {
  background: #e8f5e9;
  color: #2e7d32;
  padding: 15px;
  border-radius: 10px;
  margin: 20px 0;
  border-left: 4px solid #2e7d32;
}

@media (max-width: 600px) {
  .container {
    padding: 25px;
  }

  h1 {
    font-size: 1.8em;
  }

  .joke-text {
    font-size: 1em;
  }

  button {
    min-width: 120px;
    padding: 12px 20px;
    font-size: 0.9em;
  }
}
</style>
</head>
<body>

<div class="container">
  <h1>😂 Joke Generator</h1>
  <p class="subtitle">Get random jokes to brighten your day!</p>

  <div class="category-select-wrapper">
    <select id="categorySelect" class="category-select">
      <option value="random">Random (All Categories)</option>
      <option value="general">General</option>
      <option value="programming">Programming</option>
      <option value="knock-knock">Knock-Knock</option>
    </select>
  </div>

  <div class="joke-box">
    <div class="joke-text" id="jokeText">Click "Get Joke" to start laughing! 😄</div>
  </div>

  <div class="buttons">
    <button class="btn-primary" id="getJokeBtn">Get Joke</button>
    <button class="btn-secondary" id="shareBtn">Share</button>
    <button class="btn-secondary" id="copyBtn">Copy</button>
  </div>

  <div class="stats">
    <div class="stat-item">
      <div class="stat-value" id="jokeCount">0</div>
      <div class="stat-label">Jokes Loaded</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="likeCount">0</div>
      <div class="stat-label">Favorites</div>
    </div>
  </div>
</div>

<script>
// API endpoints
const API_URLs = {
  random: 'https://v2.jokeapi.dev/joke/Any',
  general: 'https://v2.jokeapi.dev/joke/General',
  programming: 'https://v2.jokeapi.dev/joke/Programming',
  'knock-knock': 'https://v2.jokeapi.dev/joke/Knock-Knock'
};

let jokeCount = 0;
let favoriteJokes = [];
let currentJoke = '';

// Load favorites from localStorage
function loadFavorites() {
  const saved = localStorage.getItem('favoriteJokes');
  if (saved) {
    favoriteJokes = JSON.parse(saved);
    document.getElementById('likeCount').textContent = favoriteJokes.length;
  }
}

// Save favorites to localStorage
function saveFavorites() {
  localStorage.setItem('favoriteJokes', JSON.stringify(favoriteJokes));
  document.getElementById('likeCount').textContent = favoriteJokes.length;
}

// Get random joke
async function getJoke() {
  const category = document.getElementById('categorySelect').value;
  const jokeText = document.getElementById('jokeText');
  const getJokeBtn = document.getElementById('getJokeBtn');
  const apiUrl = API_URLs[category];

  // Add loading state
  jokeText.innerHTML = '<div class="loading">Loading joke...</div>';
  getJokeBtn.disabled = true;

  try {
    const response = await fetch(apiUrl);
    
    if (!response.ok) {
      throw new Error(`API Error: ${response.status}`);
    }

    const data = await response.json();

    // Check for error in API response
    if (data.error) {
      throw new Error(data.message || 'Failed to fetch joke');
    }

    // Format joke based on type
    if (data.type === 'single') {
      currentJoke = data.joke;
    } else if (data.type === 'twopart') {
      currentJoke = `${data.setup}\n\n${data.delivery}`;
    }

    jokeText.textContent = currentJoke;
    jokeCount++;
    document.getElementById('jokeCount').textContent = jokeCount;
    
    // Save to localStorage
    localStorage.setItem('jokeCount', jokeCount);

  } catch (error) {
    console.error('Error fetching joke:', error);
    jokeText.innerHTML = `<div class="error">❌ Error: ${error.message}<br><small>Please check your internet connection and try again</small></div>`;
  } finally {
    getJokeBtn.disabled = false;
  }
}

// Share joke
function shareJoke() {
  if (!currentJoke) {
    alert('No joke to share! Get a joke first.');
    return;
  }

  const text = `${currentJoke}\n\n😂 Generated by Joke Generator!`;

  if (navigator.share) {
    navigator.share({
      title: 'Check out this joke!',
      text: text
    }).catch(err => console.error('Share failed:', err));
  } else {
    // Fallback for browsers that don't support share API
    const jokeText = document.getElementById('jokeText');
    jokeText.innerHTML = '<div class="success">✅ Copied to clipboard!</div>';
    navigator.clipboard.writeText(text);
    setTimeout(() => {
      jokeText.textContent = currentJoke;
    }, 2000);
  }
}

// Copy joke
function copyJoke() {
  if (!currentJoke) {
    alert('No joke to copy! Get a joke first.');
    return;
  }

  navigator.clipboard.writeText(currentJoke).then(() => {
    const jokeText = document.getElementById('jokeText');
    jokeText.innerHTML = '<div class="success">✅ Joke copied to clipboard!</div>';
    setTimeout(() => {
      jokeText.textContent = currentJoke;
    }, 2000);
  }).catch(err => {
    console.error('Copy failed:', err);
    alert('Failed to copy. Please try again.');
  });
}

// Event listeners
document.getElementById('getJokeBtn').addEventListener('click', getJoke);
document.getElementById('shareBtn').addEventListener('click', shareJoke);
document.getElementById('copyBtn').addEventListener('click', copyJoke);

// Load initial data
window.addEventListener('load', () => {
  loadFavorites();
  const savedJokeCount = localStorage.getItem('jokeCount');
  if (savedJokeCount) {
    jokeCount = parseInt(savedJokeCount);
    document.getElementById('jokeCount').textContent = jokeCount;
  }
});

// Get a joke on Enter key
document.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    getJoke();
  }
});
</script>

</body>
</html>
